<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>RustChat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d9480f'/%3E%3Cpath d='M9 22V10h7a4 4 0 0 1 1 7.8L21 22h-3l-3.4-4H12v4z M12 12.5v3h4a1.5 1.5 0 0 0 0-3z' fill='white' fill-rule='evenodd'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('rustchat.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#composer-input">Skip to message box</a>

  <!-- Login -->
  <main id="login" class="login" hidden>
    <form id="login-form" class="card" autocomplete="off">
      <div class="brand brand-lg"><span class="logo" aria-hidden="true">R</span><span>RustChat</span></div>
      <p class="muted">Real-time chat, powered by Rust. Pick a name to get started.</p>
      <label for="username-input">Username</label>
      <input id="username-input" name="username" maxlength="24" required spellcheck="false" autocapitalize="off"
             pattern="[A-Za-z0-9_.\-]+" placeholder="e.g. ferris" aria-describedby="login-error">
      <p id="login-error" class="form-error" role="alert"></p>
      <button class="btn primary" type="submit">Join chat</button>
    </form>
  </main>

  <!-- App -->
  <div id="app" class="app" hidden>
    <div id="scrim" class="scrim" hidden></div>

    <aside id="sidebar" class="sidebar" aria-label="Rooms">
      <div class="sidebar-head">
        <div class="brand"><span class="logo" aria-hidden="true">R</span><span>RustChat</span></div>
        <button id="close-sidebar" class="icon-btn mobile-only" aria-label="Close room list">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <h2 class="section-title" id="rooms-title">Rooms</h2>
      <nav aria-labelledby="rooms-title"><ul id="room-list" class="room-list"></ul></nav>
      <form id="new-room-form" class="new-room" autocomplete="off">
        <label for="new-room-input" class="sr-only">New room name</label>
        <input id="new-room-input" maxlength="32" placeholder="New room…" spellcheck="false" autocapitalize="off">
        <button class="icon-btn" type="submit" aria-label="Create room">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>
      <div class="me">
        <span id="me-avatar" class="avatar" aria-hidden="true"></span>
        <div class="me-text"><strong id="me-name"></strong><span id="conn-status" class="status" role="status">Connecting…</span></div>
        <button id="logout" class="icon-btn" aria-label="Change username" title="Change username">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/></svg>
        </button>
      </div>
    </aside>

    <main class="chat" aria-label="Conversation">
      <header class="chat-head">
        <button id="open-sidebar" class="icon-btn mobile-only" aria-label="Open room list">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="chat-title">
          <h1 id="room-title"># —</h1>
          <span id="room-sub" class="muted"></span>
        </div>
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle light/dark theme" title="Toggle theme">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button id="open-people" class="icon-btn" aria-label="Show people online" aria-expanded="false" aria-controls="people">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>
        </button>
      </header>

      <div class="messages-wrap">
        <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Messages" tabindex="0"></div>
        <button id="jump" class="jump" hidden>New messages ↓</button>
        <div id="empty" class="empty" hidden>
          <p>Pick a room to start chatting.</p>
        </div>
      </div>

      <div id="typing" class="typing" aria-live="polite"></div>

      <form id="composer" class="composer" autocomplete="off">
        <label for="composer-input" class="sr-only">Message</label>
        <input id="composer-input" maxlength="2000" placeholder="Write a message…" disabled>
        <button id="send" class="btn primary" type="submit" disabled aria-label="Send message">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"/></svg>
          <span class="send-label">Send</span>
        </button>
      </form>
    </main>

    <aside id="people" class="people" aria-label="People online">
      <h2 class="section-title">Online <span id="people-count" class="count">0</span></h2>
      <ul id="people-list" class="people-list"></ul>
    </aside>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
