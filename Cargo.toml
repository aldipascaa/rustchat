[package]
name = "rustchat"
version = "1.1.0"
edition = "2024"
description = "Real-time chat server with web client"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.7", features = ["ws"] }
chrono = "0.4.45"
futures-util = "0.3.34"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
base64 = "0.22"
sha2 = "0.10"
tokio-tungstenite = "0.30.0"
